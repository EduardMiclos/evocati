# Push to main → build → Firebase Hosting + Firestore rules.
# Pull requests only build and check. Setup: see README ("Going live").
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Contact form recipient matches firestore.rules
        run: |
          to=$(grep -oP "CONTACT_FORM_TO = '\K[^']+" src/config.ts)
          grep -qF "d.to == '$to'" firestore.rules || {
            echo "::error file=firestore.rules::Allow '$to' (CONTACT_FORM_TO in src/config.ts) in firestore.rules"
            exit 1
          }
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to Firebase
    needs: build
    # Waits until the FIREBASE_PROJECT_ID variable is set (see README).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - run: npx --yes firebase-tools@15.32.1 deploy --only hosting,firestore:rules --project "${{ vars.FIREBASE_PROJECT_ID }}" --non-interactive
